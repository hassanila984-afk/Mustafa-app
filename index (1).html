(function(){
  if (window.google && google.script && google.script.run) return;
  function call(fn, args){
    return fetch(window.APP_URL, {method:'POST', body: JSON.stringify({fn: fn, args: args}),
      headers:{'Content-Type':'text/plain;charset=utf-8'}, redirect:'follow', credentials:'omit', cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('NetworkError: HTTP ' + r.status); return r.text(); })

  }
  function runner(){
    var ok = function(){}, fail = function(){};
    var p = new Proxy({}, {get: function(_, name){
      if (name === 'withSuccessHandler') return function(f){ ok = f; return p; };
      if (name === 'withFailureHandler') return function(f){ fail = f; return p; };
      return function(){ var a = Array.prototype.slice.call(arguments);
        call(name, a).then(function(j){ if (j.ok) ok(j.r); else fail(new Error(j.e)); },
                           function(err){ fail(new Error('NetworkError: ' + ((err && err.message) || err))); }); };
    }});
    return p;
  }
  window.google = {script: {get run(){ return runner(); }}};
})();

<style>
/* =========================================================
   هوية مصطفى ريسان: زيتوني غامق، ذهبي، عاجي
   ========================================================= */
:root{
  --bg:#F4F1E6; --surface:#FFFFFF; --surface2:#ECE7D4; --hover:#FAF8F0;
  --text:#1E2311; --mute:#6A6B57; --line:#DCD5BD; --line2:#EAE4D1;
  --brand:#2F3519; --brand2:#3B4322; --brand3:#4B552D; --brand-line:#48502F;
  --on-brand:#F1EDDF; --on-brand-mute:#C3BFA2;
  --gold:#94763A; --gold-l:#DABF7F; --accent:#C9A85C; --accent-2:#B8964A; --on-accent:#222710;
  --ok:#3A7A3D; --ok-bg:#E2EEDA; --bad:#B23F2E; --bad-bg:#F7E0DA; --bad-line:#EDC5BD;
  --warn:#86600D; --warn-bg:#F7ECCD; --wa:#1E8F4F;
  --overlay:rgba(24,28,12,.55); --shadow:rgba(30,35,15,.22);
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --side:256px;
  --fd:'Amiri','Tajawal',serif;
  color-scheme:light;
}
html.dark{
  --bg:#13160B; --surface:#1C2012; --surface2:#262B18; --hover:#20251A;
  --text:#ECE8D7; --mute:#A3A189; --line:#353B24; --line2:#2A2F1D;
  --brand:#1F2412; --brand2:#2B3119; --brand3:#394124; --brand-line:#363D22;
  --on-brand:#EFEBDC; --on-brand-mute:#B5B196;
  --gold:#D4B76E; --gold-l:#DCC487; --accent:#C9A85C; --accent-2:#D6B66A; --on-accent:#1C200C;
  --ok:#86C489; --ok-bg:#1E3320; --bad:#EE8370; --bad-bg:#3B1F19; --bad-line:#5A2C24;
  --warn:#E5C066; --warn-bg:#3A3116; --wa:#24A35C;
  --overlay:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body.fs-1{zoom:1.1} body.fs-2{zoom:1.22}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:'Tajawal',sans-serif;font-weight:800;margin:0;line-height:1.25}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* خط التمرير: رفيع وهادئ */
*{scrollbar-width:thin;scrollbar-color:rgba(184,150,74,.45) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(184,150,74,.40);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(184,150,74,.75)}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-corner{background:transparent}
.tabs::-webkit-scrollbar,.days::-webkit-scrollbar{height:0}
.tabs,.days{scrollbar-width:none}

/* ---------- shell ---------- */
.side{position:fixed;inset:0 0 0 auto;width:var(--side);background:var(--brand);color:var(--on-brand);display:flex;flex-direction:column;padding:18px 14px 12px;z-index:20;border-inline-start:1px solid var(--brand-line)}
.brand{display:flex;align-items:center;gap:12px;padding:2px 6px 16px;border-bottom:1px solid var(--brand-line);margin-bottom:12px}
.brand img{width:58px;height:58px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(201,168,92,.55)}
.brand>div{min-width:0}
.brand b{display:block;font-family:var(--fd);font-size:22px;color:var(--gold-l);line-height:1.25;white-space:nowrap}
.brand span{font-size:12px;color:var(--on-brand-mute);letter-spacing:.06em}
.gsearch{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;margin:0 2px 12px;padding:10px 12px;border-radius:12px;background:var(--brand2);color:var(--on-brand-mute);font-size:14px;border:1px solid var(--brand-line)}
.gsearch svg{width:18px;height:18px;flex:none}
.gsearch kbd{margin-inline-start:auto;font-family:inherit;font-size:12px;border:1px solid var(--brand-line);border-radius:6px;padding:0 6px;color:var(--on-brand-mute)}
.gsearch:hover{color:var(--on-brand)}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1;scrollbar-color:rgba(218,191,127,.25) transparent;padding-inline-end:4px}
.nav::-webkit-scrollbar{width:4px}
.nav::-webkit-scrollbar-thumb{background:rgba(218,191,127,.2)}
.nav:hover::-webkit-scrollbar-thumb{background:rgba(218,191,127,.5)}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--on-brand);font-weight:500;opacity:.9}
.nav button svg{width:20px;height:20px;flex:none;opacity:.8}
.nav button:hover{background:var(--brand2);opacity:1}
.nav button.on{background:var(--accent);color:var(--on-accent);font-weight:700;opacity:1}
.nav button.on svg{opacity:1}
.nav button .badge{margin-inline-start:auto}
.nav .sep{height:1px;background:var(--brand-line);margin:8px 6px}
.sidefoot{display:flex;gap:6px;padding-top:10px;border-top:1px solid var(--brand-line);margin-top:8px}
.sidefoot button{all:unset;cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:10px;color:var(--on-brand-mute);font-size:13px}
.sidefoot button:hover{background:var(--brand2);color:var(--on-brand)}
.sidefoot svg{width:18px;height:18px}
main{margin-right:var(--side);min-height:100vh;padding:26px 34px 120px;overflow-x:hidden}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:28px}
.top .sub{color:var(--mute);font-size:14px}
.top .grow{flex:1}
.bottom,.mbar{display:none}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:12px;font-weight:700;min-width:22px;height:22px;display:inline-grid;place-items:center;padding:0 6px}
.badge.gold{background:var(--accent);color:var(--on-accent)}
html.dark .badge{color:#1b0d09}

/* ---------- controls ---------- */
.btn{text-decoration:none;border:0;cursor:pointer;border-radius:var(--r-md);padding:10px 18px;font-weight:700;background:var(--brand);color:var(--on-brand);display:inline-flex;align-items:center;gap:8px;min-height:44px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.honey{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}
html.dark .btn.ok{color:#0f1f10}
.btn.bad{background:transparent;color:var(--bad);border:1.5px solid var(--bad-line)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:var(--r-sm)}
.btn svg{width:18px;height:18px}
.iconbtn{border:0;background:transparent;cursor:pointer;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--text);text-decoration:none}
.iconbtn svg{width:22px;height:22px}
.iconbtn:hover{background:var(--surface2)}
.wa,.btn.wa{background:var(--wa);color:#fff}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=search],input[type=password],select,textarea{
  width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:var(--r-sm);padding:10px 12px;min-height:46px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:84px;resize:vertical}
.search{position:relative}
.search input{padding-right:42px;min-height:52px;font-size:17px;border-radius:var(--r-md)}
.search svg{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:20px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;min-height:40px}
.chip.on{background:var(--brand);color:var(--gold-l);border-color:var(--brand)}
html.dark .chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip svg{width:16px;height:16px;vertical-align:-3px}
.chip.mini{min-height:32px;padding:3px 11px;font-size:14px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--text);padding:9px 16px;cursor:pointer;font-weight:700;min-height:42px}
.seg button+button{border-inline-start:1.5px solid var(--line)}
.seg button.on{background:var(--brand);color:var(--gold-l)}
html.dark .seg button.on{background:var(--accent);color:var(--on-accent)}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.panel h2{font-size:19px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.panel h2 .grow{flex:1}
.panel h2>svg{width:22px;height:22px;flex:none;color:var(--gold)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line2);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700}
.row .s{color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--surface2);color:var(--gold);display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--fd);font-size:20px}
.avatar svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-bad{background:var(--bad-bg);color:var(--bad)}
.p-warn{background:var(--warn-bg);color:var(--warn)} .p-mute{background:var(--surface2);color:var(--mute)}
.p-ink{background:var(--brand);color:var(--gold-l)}
.empty{color:var(--mute);text-align:center;padding:28px 12px}
.empty::before{content:'';display:block;width:64px;height:40px;margin:0 auto 12px;background:var(--accent);opacity:.55;
  -webkit-mask:url("data:image/svg+xml,%3Csvg xmlns='http:%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 64 40' fill='none' stroke='black' stroke-width='3.2' stroke-linecap='round'%3E%3Cpath d='M32 20c-6-9-10-13-17-13a13 13 0 1 0 0 26c7 0 11-4 17-13s10-13 17-13a13 13 0 1 1 0 26c-7 0-11-4-17-13z'/%3E%3C/svg%3E") center/contain no-repeat;
          mask:url("data:image/svg+xml,%3Csvg xmlns='http:%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 64 40' fill='none' stroke='black' stroke-width='3.2' stroke-linecap='round'%3E%3Cpath d='M32 20c-6-9-10-13-17-13a13 13 0 1 0 0 26c7 0 11-4 17-13s10-13 17-13a13 13 0 1 1 0 26c-7 0-11-4-17-13z'/%3E%3C/svg%3E") center/contain no-repeat}
.empty.sm::before{display:none}
.empty b{display:block;color:var(--text);margin-bottom:4px;font-size:17px}
.empty .btn{margin-top:12px}

/* ---------- today ---------- */
.hero{background:var(--brand);color:var(--on-brand);border-radius:22px;padding:26px 28px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;margin-bottom:20px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;left:-60px;top:50%;width:280px;height:280px;transform:translateY(-50%);background:var(--logo) center/contain no-repeat;opacity:.08;border-radius:50%;pointer-events:none}
.chart{font-family:var(--fd);color:var(--gold-l);text-align:center;line-height:1.05;min-width:120px;position:relative;z-index:1}
.chart .l1{font-size:66px;font-weight:700}
.chart .l2{font-size:22px;color:var(--gold-l);margin-top:4px}
.chart .l3{font-size:12px;color:var(--on-brand-mute);letter-spacing:.3em;margin-top:8px;font-family:'Tajawal'}
.hero>div{position:relative;z-index:1}
.hero h1{font-size:30px;color:var(--on-brand)}
.hero p{margin:6px 0 0;color:var(--on-brand-mute)}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hero .acts .btn{background:var(--brand2);color:var(--on-brand)}
.hero .acts .btn.honey{background:var(--accent);color:var(--on-accent)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:right;border-top:4px solid var(--accent);font:inherit}
.kpi .v{font-size:30px;font-weight:800;line-height:1.1}
.kpi .k{color:var(--mute);font-size:14px}
.kpi.alert{border-top-color:var(--bad)} .kpi.alert .v{color:var(--bad)}
.kpi.calm{border-top-color:var(--ok)}
.bday{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,var(--warn-bg),var(--surface));border:1.5px solid var(--accent);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:20px}
.bday .ico{font-size:30px;line-height:1}
.welcome{border:1.5px dashed var(--accent);background:var(--surface)}
.welcome ol{margin:6px 0 0;padding-inline-start:22px;line-height:2}

/* ---------- profile ---------- */
.prof>*{min-width:0}
.prof{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.idcard{background:var(--brand);color:var(--on-brand);border-radius:var(--r-lg);padding:22px}
.idcard .avatar{width:64px;height:64px;font-size:30px;background:var(--brand2);color:var(--gold-l)}
.idcard h2{font-size:24px;margin:12px 0 2px;color:var(--on-brand)}
.idcard .meta{color:var(--on-brand-mute);font-size:14px}
.idcard .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.idcard .acts .btn{justify-content:center}
.idcard .acts .btn:not(.wa):not(.honey){background:var(--brand2)}
.idcard .rx{grid-template-columns:1fr;gap:8px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--mute)} .kv dd{margin:0;font-weight:500}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:14px;overflow:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--accent)}

/* the Rx card */
.rx{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lensbox{border:1.5px solid var(--line);border-radius:999px 999px 40px 40px;padding:14px 18px 12px;text-align:center;background:var(--surface)}
.lensbox.dk{background:var(--brand2);border-color:var(--brand-line);color:var(--on-brand)}
.lensbox .eye{font-family:var(--fd);color:var(--gold);font-size:16px}
.lensbox.dk .eye{color:var(--gold-l)}
.lensbox .vals{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.lensbox .vals b{display:block;font-size:17px;direction:ltr}
.lensbox .vals i{font-style:normal;color:var(--mute);font-size:11px}
.lensbox.dk .vals i{color:var(--on-brand-mute)}
.visit{border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-bottom:12px;background:var(--surface)}
.visit .hd{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}

/* ---------- forms / modal ---------- */
.modal{position:fixed;inset:0;background:var(--overlay);display:none;z-index:60;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.modal.open{display:flex}
.sheet{background:var(--bg);border-radius:22px;width:min(760px,100%);box-shadow:0 30px 80px var(--shadow);overflow:hidden;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.sheet header{background:var(--brand);color:var(--on-brand);padding:16px 20px;display:flex;align-items:center;gap:10px}
.sheet header h2{font-size:20px;color:var(--gold-l);flex:1}
.sheet header .iconbtn{color:var(--on-brand)}
.sheet header .iconbtn:hover{background:var(--brand2)}
.sheet .body{padding:18px 20px}
.sheet footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;background:var(--surface);position:sticky;bottom:0}
.sheet footer .grow{flex:1}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field label em{color:var(--bad);font-style:normal}
.field.full{grid-column:1/-1}
.field .hint{color:var(--mute);font-size:13px;margin-top:4px}
.field .warnbox{margin-top:6px;background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:8px 10px;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.quick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
fieldset{border:0;padding:0;margin:0 0 18px;min-width:0}
fieldset legend{font-family:var(--fd);font-weight:700;font-size:19px;color:var(--gold);padding:0;margin-bottom:10px;width:100%;border-bottom:1px solid var(--line);padding-bottom:6px}
.picker{position:relative}
.sugg{position:absolute;inset:100% 0 auto 0;background:var(--surface);border:1.5px solid var(--accent);border-top:0;border-radius:0 0 10px 10px;z-index:5;max-height:260px;overflow:auto;display:none}
.sugg.open{display:block}
.sugg div{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line2)}
.sugg div:hover,.sugg div.hl{background:var(--surface2)}
.sugg div small{color:var(--mute);margin-inline-start:8px}
.rxedit{width:100%;border-collapse:separate;border-spacing:6px}
.rxedit th{font-size:13px;color:var(--mute);font-weight:700}
.rxedit td:first-child{font-family:var(--fd);color:var(--gold);white-space:nowrap;font-size:17px}
.rxedit select{min-width:64px;min-height:42px;padding:6px;direction:ltr;text-align:center}
.calc{background:var(--brand);color:var(--on-brand);border-radius:var(--r-md);padding:14px 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.calc b{color:var(--gold-l);font-size:20px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.slot{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);padding:8px 4px;cursor:pointer;font-weight:700;min-height:42px}
.slot.on{background:var(--brand);color:var(--gold-l);border-color:var(--brand)}
.slot:disabled{background:var(--surface2);color:var(--mute);opacity:.6;text-decoration:line-through;cursor:not-allowed}

/* ---------- spotlight search ---------- */
.spot .body{padding:14px 16px 18px}
.gres{margin-top:12px;max-height:62vh;overflow:auto}
.gres h4{margin:14px 4px 4px;font-size:13px;color:var(--gold);font-weight:800}
.gres .row{border-radius:10px;padding:10px 8px}
.gres .row.hl{background:var(--surface2)}
.gres mark{background:var(--warn-bg);color:inherit;border-radius:3px;padding:0 1px}

/* ---------- orders ---------- */
.ocard{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:14px 4px;border-bottom:1px solid var(--line2);cursor:pointer}
.ocard:last-child{border-bottom:0}
.ocard:hover{background:var(--hover)}
.ocard .money{text-align:left;font-weight:800}
.ocard .s{color:var(--mute);font-size:14px}
.ocard .nx{justify-self:end}
.nextbtn{border:1.5px solid var(--accent);background:transparent;color:var(--gold);border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px;cursor:pointer;min-height:34px;white-space:nowrap}
.nextbtn:hover{background:var(--accent);color:var(--on-accent)}
.nextbtn.done{border-color:var(--ok);color:var(--ok)}
.nextbtn.done:hover{background:var(--ok);color:#fff}
.due-late{color:var(--bad);font-weight:700}.due-today{color:var(--warn);font-weight:700}

/* ---------- appointments ---------- */
.days{display:flex;gap:8px;overflow:auto;padding-bottom:6px;margin-bottom:14px}
.day{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px;padding:8px 14px;text-align:center;cursor:pointer;min-width:74px}
.day b{display:block;font-size:22px;font-family:var(--fd)}
.day small{color:var(--mute)}
.day.on{background:var(--brand);border-color:var(--brand);color:var(--gold-l)}
.day.on small{color:var(--on-brand-mute)}
.day .dot{display:block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:4px auto 0}
.appt{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line2)}
.appt .time{font-family:var(--fd);font-weight:700;font-size:19px;color:var(--gold)}

/* ---------- inventory grid ---------- */
.lgwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
table.lg{border-collapse:collapse;min-width:640px;width:100%}
table.lg th,table.lg td{border-bottom:1px solid var(--line2);text-align:center;padding:0;height:40px}
table.lg thead th{position:sticky;top:0;background:var(--brand);color:var(--gold-l);font-size:13px;direction:ltr;z-index:2;padding:0 6px}
table.lg tbody th{position:sticky;right:0;background:var(--surface2);font-weight:800;direction:ltr;min-width:76px;z-index:1}
table.lg tr.zero th{background:var(--accent);color:var(--on-accent)}
table.lg td button{all:unset;cursor:pointer;width:100%;height:40px;display:grid;place-items:center;font-weight:700}
table.lg td button.has{background:var(--ok-bg);color:var(--ok)}
table.lg td button.low{background:var(--warn-bg);color:var(--warn)}
table.lg td button.out{background:var(--bad);color:#fff}
table.lg td button:hover{outline:2px solid var(--accent);outline-offset:-2px}
.stepper{display:flex;align-items:center;gap:12px;justify-content:center;margin:10px 0}
.stepper button{width:64px;height:64px;border-radius:50%;border:0;font-size:30px;font-weight:800;cursor:pointer;background:var(--surface2);color:var(--text)}
.stepper button.x10{width:52px;height:52px;font-size:16px;color:var(--mute);direction:ltr}
@media (max-width:520px){.stepper{gap:6px}.stepper button{width:54px;height:54px}.stepper button.x10{width:46px;height:46px;font-size:14px}.stepper .val{min-width:64px;font-size:38px}}
.stepper .val{font-size:44px;font-weight:800;min-width:90px;text-align:center}
.fstep{display:flex;align-items:center;gap:6px}
.fstep button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font-size:20px;cursor:pointer;line-height:1}
.fstep b{min-width:32px;text-align:center;font-size:18px}
.fstep button.x10{width:auto;height:30px;padding:0 9px;font-size:13px;font-weight:700;border-radius:999px;color:var(--mute);direction:ltr}
.fstep button.x10:hover,.fstep button:hover{border-color:var(--accent);color:var(--text)}
@media (max-width:620px){.frow{flex-wrap:wrap}.frow .main{flex-basis:100%}.frow .fstep{margin-inline-start:auto}}
@media (max-width:520px){.fstep{gap:4px}.fstep button{width:32px;height:32px}.fstep button.x10{height:28px;padding:0 6px;font-size:12px}.fstep b{min-width:26px}}

/* ---------- summary ---------- */
.bars{display:flex;align-items:flex-end;gap:10px;height:220px;padding:10px 0 0;border-bottom:2px solid var(--text)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar i{display:block;width:100%;max-width:46px;background:var(--accent);border-radius:8px 8px 0 0;min-height:2px}
.bar.cur i{background:var(--brand3)}
html.dark .bar.cur i{background:var(--gold-l)}
.bar span{font-size:12px;color:var(--mute);margin-top:6px;white-space:nowrap}
.bar em{font-style:normal;font-size:12px;font-weight:700;margin-bottom:4px}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:right;color:var(--mute);font-size:13px;font-weight:700;padding:8px;border-bottom:2px solid var(--line)}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line2)}
table.t tr.cur td{background:var(--warn-bg);font-weight:700}
table.t tr.tot td{font-weight:800;background:var(--accent);color:var(--on-accent)}
.hbar{height:10px;background:var(--accent);border-radius:6px}

/* ---------- tickets ---------- */
.tk{border-inline-start:5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.tk.t-idea{border-color:var(--ok)} .tk.t-prob{border-color:var(--warn)} .tk.t-err{border-color:var(--bad)}
.tk.done{opacity:.55}

/* ---------- receipt: دائماً فاتح حتى يطلع حلو بالطباعة والواتساب ---------- */
.receipt{--text:#1E2311;--mute:#6A6B57;--line:#DCD5BD;--surface:#FFFFFF;--gold:#94763A;
  background:#fff;color:#1E2311;border:2px solid #C9A85C;border-radius:8px;max-width:520px;margin:0 auto;font-size:15px;overflow:hidden}
.receipt .rh{background:#2F3519;color:#DABF7F;text-align:center;padding:18px 12px 14px}
.receipt .rh img{width:92px;height:92px;border-radius:50%;display:block;margin:0 auto 6px;box-shadow:0 0 0 2px rgba(201,168,92,.6)}
.receipt .rh b{font-family:var(--fd);font-size:25px;display:block;line-height:1.3}
.receipt .rh small{color:#C3BFA2}
.receipt .rl{background:#ECE7D4;color:#5E5130;text-align:center;font-size:13px;padding:6px;border-bottom:3px solid #C9A85C}
.receipt .rb{padding:14px 18px}
.receipt .rr{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:6px 0;border-bottom:1px dashed #DCD5BD}
.receipt .rr span{color:#6A6B57;flex-shrink:0}
.receipt .rr b{white-space:nowrap;text-align:left}
.receipt .lensbox{background:#fff;border-color:#DCD5BD;color:#1E2311}
.receipt .lensbox .eye{color:#94763A}
.receipt .lensbox .vals i{color:#6A6B57}
.receipt .tot{background:#C9A85C;color:#222710;margin:10px -18px 0;padding:10px 18px;display:flex;justify-content:space-between;font-weight:800;font-size:18px}
.receipt .rem{background:#2F3519;color:#F1EDDF;margin:0 -18px;padding:10px 18px;display:flex;justify-content:space-between;font-weight:800;font-size:18px}
.receipt .thanks{text-align:center;color:#94763A;font-weight:700;padding:14px 0 6px;font-family:var(--fd);font-size:18px}

@keyframes pulse{50%{opacity:.25}}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--accent);animation:spin 0.8s linear infinite}

.boot{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--mute)}

.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- الجرد ---------- */
.itiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}
.itile{position:relative;text-align:right;font:inherit;color:var(--text);background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px 18px 14px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"ii it" "iv iv" "is is";gap:2px 10px;align-items:center;overflow:hidden}
.itile .ii{grid-area:ii;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--gold)}

.lpanel{position:sticky;top:10px;z-index:6;display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--brand);color:var(--on-brand);border-radius:18px;padding:14px 18px;margin-bottom:14px;box-shadow:0 10px 26px var(--shadow)}

.lsel select{-webkit-appearance:none;appearance:none;background:transparent;border:0;color:var(--gold-l);font-weight:800;font-size:19px;min-height:40px;width:auto;padding:0 6px;direction:ltr;text-align:center;cursor:pointer}

.lsel button:hover{background:var(--brand3);color:var(--on-brand)}
.lqty{flex:1;min-width:280px;display:flex;flex-direction:column;align-items:center;gap:6px}
.lqbtns{display:flex;align-items:center;gap:8px}
.lqbtns button{width:50px;height:50px;border-radius:50%;border:0;background:var(--brand2);color:var(--on-brand);font-size:26px;font-weight:800;cursor:pointer}

.lqv .pill{margin-top:4px;font-size:12px}
.lqfoot{display:flex;gap:12px;font-size:13px;align-items:center}

.linkbtn{border:0;background:transparent;color:var(--gold-l);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.lgtools{margin-bottom:10px}
.lgkey{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}

.k-has{background:var(--ok-bg);border:1px solid var(--ok)} .k-low{background:var(--warn-bg);border:1px solid var(--warn)} .k-out{background:var(--bad)}
table.lg thead th.sel{background:var(--accent);color:var(--on-accent)}

table.lg td button.cur{outline:3px solid var(--accent);outline-offset:-3px;border-radius:6px;position:relative;z-index:1}

/* ---------- حركات ---------- */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes bumpk{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes flashk{0%{box-shadow:inset 0 0 0 40px color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:inset 0 0 0 40px transparent}}
@keyframes popin{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
.enter>*{animation:rise .42s cubic-bezier(.2,.75,.25,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(n+6){animation-delay:.24s}
.enter .kpis>*,.enter .itiles>*{animation:rise .45s cubic-bezier(.2,.75,.25,1) both}
.enter .kpis>*:nth-child(1),.enter .itiles>*:nth-child(1){animation-delay:.08s}
.enter .kpis>*:nth-child(2),.enter .itiles>*:nth-child(2){animation-delay:.12s}
.enter .kpis>*:nth-child(3),.enter .itiles>*:nth-child(3){animation-delay:.16s}
.enter .kpis>*:nth-child(4){animation-delay:.2s}.enter .kpis>*:nth-child(5){animation-delay:.24s}.enter .kpis>*:nth-child(6){animation-delay:.28s}.enter .kpis>*:nth-child(7){animation-delay:.32s}.enter .kpis>*:nth-child(8){animation-delay:.36s}
.enter .chart .l1{animation:popin .5s .1s both}
.bump{display:inline-block;animation:bumpk .32s ease}
.flash{animation:flashk .7s ease-out}
.btn,.chip,.kpi,.itile,.iconbtn,.nextbtn,.fstep button,.stepper button,.lqbtns button,.slot,.day,.ltype,.nav button,.bottom button,.row,.ocard,.tabs button,.seg button,.gsearch,.fab{transition:transform .14s ease,background-color .2s,color .2s,box-shadow .2s,border-color .2s,opacity .2s}
.btn:active,.chip:active,.iconbtn:active,.nextbtn:active,.fstep button:active,.stepper button:active,.lqbtns button:active,.slot:active,.day:active,.ltype:active,.itile:active,.seg button:active{transform:scale(.95)}
.kpi:hover,.itile:hover{transform:translateY(-3px);box-shadow:0 10px 24px var(--shadow)}
.nav button:hover{transform:translateX(-3px)}
.panel{transition:box-shadow .25s,border-color .25s}
.modal.open{animation:fadeIn .2s ease}
.fab:hover{transform:scale(1.06)}
.fab svg{transition:transform .25s cubic-bezier(.3,1.5,.6,1)}
.fab.open svg{transform:rotate(45deg)}
.menu.open{animation:rise .22s ease both}
.menu.open button{animation:rise .26s ease both}
.menu.open button:nth-child(2){animation-delay:.03s}.menu.open button:nth-child(3){animation-delay:.06s}.menu.open button:nth-child(4){animation-delay:.09s}.menu.open button:nth-child(5){animation-delay:.12s}
.toast{transform:translate(50%,14px);transition:opacity .22s,transform .3s cubic-bezier(.2,1.3,.4,1)}
.toast.show{transform:translate(50%,0)}
.tabs button{transition:color .2s,border-color .25s}

/* ---------- حركات المخزن ---------- */
.itiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.iconbtn.sm{width:36px;height:36px}.iconbtn.sm svg{width:18px;height:18px;color:var(--mute)}

.mstats span{color:var(--mute);font-size:13px}.mstats b{font-size:22px;font-weight:800}.mstats b small{font-size:12px;color:var(--mute)}.mstats em{font-style:normal;color:var(--mute);font-size:12px}

.stockline.ok{background:var(--ok-bg);color:var(--ok)}
.stockline.warn{background:var(--warn-bg);color:var(--warn)}
.stockline .btn{flex:none}

table.mvt tr.click{cursor:pointer}
table.mvt tr.click:hover td{background:var(--hover)}
.qplus{color:var(--ok)}
.lstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.lstat{background:var(--surface2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start}
.lstat b{font-size:22px;font-weight:800}.lstat span{font-size:12px;color:var(--mute)}
.lstat.cur{background:var(--brand);color:var(--gold-l)}.lstat.cur span{color:var(--on-brand-mute)}
.lstat.okk{background:var(--ok-bg);color:var(--ok)}.lstat.badk{background:var(--bad-bg);color:var(--bad)}
.issue{display:flex;flex-direction:column;gap:8px}
.iline{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);cursor:pointer}
.iline:has(input:checked){border-color:var(--accent);background:var(--warn-bg)}
.iline input{width:22px;height:22px;accent-color:var(--brand3);flex:none}

.iline .mute{font-size:13px}
.iline select{margin-top:6px;min-height:36px;padding:4px 8px;width:auto;font-size:14px}

.pline:has(> input[type=text]){grid-template-columns:110px minmax(0,3fr) 70px 110px 40px}
.pline:has(> select:nth-child(2):last-of-type){grid-template-columns:110px minmax(0,3fr) 70px 110px 40px}
.pline select,.pline input{min-height:40px;padding:6px 8px;font-size:14px}
.recon{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding-inline-end:4px}

.rch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}

@media (max-width:900px){
  .itiles{grid-template-columns:repeat(2,minmax(0,1fr))}

  .pline .iconbtn{justify-self:end}
}

.mnav b{font-size:20px;min-width:150px;text-align:center}

  table.mvlog td:nth-child(4)::before{content:'الرصيد '}
  table.mvlog td:nth-child(1){grid-area:2/1;font-size:12px;color:var(--mute)}

  table.exlist tr{grid-template-columns:1fr auto}

.login h1{font-size:26px;margin-bottom:6px}
.login>p{max-width:360px;margin:0 0 16px}
.login form{width:min(360px,100%);display:flex;flex-direction:column;gap:12px;text-align:right;animation:rise .45s .1s both}
.login .btn{justify-content:center;min-height:50px;font-size:17px;margin-top:6px}
.login input{font-size:18px}
.whoami{display:flex;align-items:center;gap:10px;padding:10px 6px 0;margin-top:8px;border-top:1px solid var(--brand-line)}
.whoami .avatar{width:34px;height:34px;font-size:16px;background:var(--brand2);color:var(--gold-l)}
.whoami b{display:block;font-size:14px;color:var(--on-brand)}.whoami span{font-size:12px;color:var(--on-brand-mute)}
.whoami .iconbtn{color:var(--on-brand-mute);width:36px;height:36px}.whoami .iconbtn:hover{background:var(--brand2);color:var(--on-brand)}
.whoami .iconbtn svg{width:19px;height:19px}
.sidefoot{border-top:0;margin-top:4px}
.permpills{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.permpills span{font-size:11px;background:var(--surface2);color:var(--mute);border-radius:999px;padding:1px 8px}
.perms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.perm{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.perm:has(input:checked){border-color:var(--accent);background:var(--warn-bg)}
.perm input{width:20px;height:20px;accent-color:var(--brand3)}
.audit{display:flex;flex-direction:column;max-height:65vh;overflow:auto}
.au{padding:10px 4px;border-bottom:1px solid var(--line2)}
.auh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.aud{font-size:13px;color:var(--mute);margin-top:4px;word-break:break-word;line-height:1.7}
@media (max-width:620px){.perms{grid-template-columns:1fr}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .side{display:none}
  main{margin:0;padding:72px 16px 110px}
  .mbar{display:flex;position:fixed;inset:0 0 auto 0;height:58px;background:var(--brand);color:var(--on-brand);z-index:40;align-items:center;gap:10px;padding:0 10px 0 6px;box-shadow:0 2px 12px var(--shadow)}
  .mbar img{width:40px;height:40px;border-radius:50%}
  .mbar b{font-family:var(--fd);font-size:20px;color:var(--gold-l);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbar .iconbtn{color:var(--on-brand)}
  .mbar .iconbtn:hover{background:var(--brand2)}
  .top h1{font-size:23px}
  .bottom{display:flex;position:fixed;inset:auto 0 0 0;background:var(--brand);z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -2px 12px var(--shadow)}
  .bottom button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--on-brand-mute);font-size:12px;padding:6px 8px;border-radius:10px;min-width:56px;position:relative}
  .bottom button svg{width:22px;height:22px}
  .bottom button.on{color:var(--gold-l)}
  .bottom .badge{position:absolute;top:0;left:6px;min-width:18px;height:18px;font-size:11px}
  .fab{left:16px;bottom:84px;width:56px;height:56px}
  .menu{left:16px;bottom:150px}
  .toast{bottom:150px}
  .sync{bottom:84px}
  .g2,.g3,.prof{grid-template-columns:1fr}
  .itiles{gap:8px}.itile{padding:12px 12px 10px;grid-template-columns:1fr;grid-template-areas:"ii" "it" "iv" "is"}.itile .ii{width:34px;height:34px}.itile .it{font-size:15px}.itile .iv b{font-size:24px}.itile .iv small{display:none}.itile .is{display:none}
  .ltypes{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}.ltypes::-webkit-scrollbar{display:none}.ltype{flex:none;white-space:nowrap}
  .lqfoot .mute{display:none}
  .lpanel{top:66px;padding:12px;gap:10px;justify-content:center}.lpick{width:100%;justify-content:center}.lqty{min-width:0}.lqbtns{gap:6px}.lqbtns button{width:46px;height:46px}.lqbtns button.x10{width:42px}.lqv{min-width:78px}.lqv b{font-size:36px}
  .nav button:hover{transform:none}
  .hero{grid-template-columns:1fr;padding:20px;gap:12px}
  .hero::after{width:200px;height:200px;left:-50px;opacity:.05}
  .chart{display:flex;align-items:baseline;gap:12px;text-align:right}
  .chart .l1{font-size:48px}
  .chart .l3{display:none}
  .hero h1{font-size:24px}
  .fgrid{grid-template-columns:1fr}
  .modal{padding:0;align-items:flex-end}
  .modal.spotm{align-items:flex-start}
  .modal.spotm .sheet{border-radius:0 0 22px 22px}
  .sheet{border-radius:22px 22px 0 0;max-height:94vh;overflow:auto}
  .kv{grid-template-columns:120px 1fr}
  .appt{grid-template-columns:64px 1fr}
  .appt .acts{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;inset:0;padding:10px}
  .receipt{border-width:1px}
}
</style>

function colIdx(L){ let n = 0; for(const ch of L) n = n*26 + ch.charCodeAt(0) - 64; return n - 1; }

function localPatch(fn, args){
  const R = D.raw;
  if(fn === 'saveRow'){
    const [key, row, fields] = args;
    const t = R[key] || (R[key] = []);
    let e = row ? t.find(x => x.row === row) : null;
    let tmp = null;
    if(!e){ tmp = -(++tmpSeq); e = {row: tmp, v: new Array(COLS[key] || 32).fill('')}; t.push(e); }
    Object.keys(fields).forEach(L => { e.v[colIdx(L)] = fields[L] == null ? '' : fields[L]; });
    const g = L => e.v[colIdx(L)], put = (L, v) => { e.v[colIdx(L)] = v; };
    if(key === 'vis') put('B', phoneOf(g('C')));
    if(key === 'ord'){ put('C', phoneOf(g('D'))); const net = num(g('I')) - num(g('J')) + num(g('K')); put('L', net); put('N', net - num(g('M'))); }
    if(key === 'appt') put('C', phoneOf(g('D')));
    return tmp;
  }
  if(fn === 'clearRow'){ const [key, row] = args; R[key] = (R[key] || []).filter(x => x.row !== row); }
  if(fn === 'setLens'){ const [b, r, c, v] = args; R.lens[b].qty[r][c] = v; }
  if(fn === 'setLensName'){ const [b, name] = args; R.lens[b].name = name; }
  if(fn === 'setSetting'){ const [k, v] = args; R.settings[k] = v; }
  if(fn === 'moveStock') localMove(R, args[0], args[1]);
  return null;
}
function serverPatch(r, tmp){
  if(r && r.stock){
    D.raw.ledger = (D.raw.ledger || []).filter(x => x._tmp !== r.opId).concat(r.ledger || []);
    const pend = outbox.some(o => o.fn === 'moveStock' || o.fn === 'setLens' || (o.fn === 'saveRow' && o.args[0] === 'frames'));
    if(!pend && !lensPend){ D.raw.lens = r.stock.lens; D.raw.frames = r.stock.frames; }
    return;
  }
  if(r && r.ledger) D.raw.ledger = (D.raw.ledger || []).concat(r.ledger);
  if(!r || !r.key) return;
  const t = D.raw[r.key] || (D.raw[r.key] = []);
  if(r.deleted){ D.raw[r.key] = t.filter(x => x.row !== r.row); return; }
  const i = t.findIndex(x => x.row === (tmp || r.row));
  const fresh = {row: r.row, v: r.v};
  if(i >= 0) t[i] = fresh; else t.push(fresh);
}
const rowKey = op => (op.fn === 'saveRow' || op.fn === 'clearRow') ? op.args[0] + ':' + (op.tmp || op.args[1]) : null;

function write(fn, args){
  let tmp = null;
  try { tmp = localPatch(fn, args); } catch(e) {}
  D = prep(D.raw); saveCache();
  outbox.push({fn, args, tmp}); saveOutbox(); setSync();
  flush();
  return Promise.resolve({local: true, tmp});
}

async function flush(){
  if(flushing) return;
  flushing = true;
  try {
    while(outbox.length){
      const op = outbox[0];
      const isRow = op.fn === 'saveRow' || op.fn === 'clearRow';
      if(isRow && op.args[1] < 0){
        const real = tmpMap[op.args[1]];
        if(!real){ outbox.shift(); saveOutbox(); continue; }   /* الصف اللي يعتمد عليه ما انحفظ */
        op.args[1] = real;
      }
      if(op.fn === 'moveStock'){
        op.args[0].forEach(m => { const mm = String(m.key || '').match(/^F(-\d+)$/); if(mm){ const real = tmpMap[mm[1]]; if(real) m.key = 'F' + real; else m._drop = true; } });
        op.args[0] = op.args[0].filter(m => !m._drop);
        if(op.args[2] != null){
          let orow = op.args[2]; if(orow < 0) orow = tmpMap[orow];
          op.args[0].forEach(m => { if(m.ref === '#ORDER') m.ref = '#ORDER:' + orow; });
        }
        op.args = op.args.slice(0, 2); saveOutbox();
      }
      let r;
      try { r = await run(op.fn, op.args); }
      catch(e){
        if(isAuthErr(e)){ needLogin('انتهت الجلسة، سجّل دخول حتى تنرفع التغييرات'); return; }
        if(isNetErr(e)){ offline = true; setSync(); clearTimeout(retryT); retryT = setTimeout(flush, 15000); return; }
        outbox.shift(); saveOutbox();
        toast('ما انحفظ: ' + cleanErr(e) + ' · رجعت البيانات من الشيت', true);
        needReload = true; continue;
      }
      if(offline){ offline = false; toast('رجع النت، وانرفعت التغييرات ✓'); }
      outbox.shift();
      if(op.tmp && r && r.row){
        tmpMap[op.tmp] = r.row;
        if(S.param === op.tmp) S.param = r.row;
        outbox.forEach(o => { if((o.fn === 'saveRow' || o.fn === 'clearRow') && o.args[1] === op.tmp) o.args[1] = r.row; });
      }
      saveOutbox();
      const rk = rowKey(op);
      const busy = rk && outbox.some(o => rowKey(o) === rk || (op.tmp && o.args && o.args[0] === op.args[0] && o.args[1] === r.row));
      if(!busy) serverPatch(r, op.tmp);
      else if(op.tmp && r && r.row){ const e = (D.raw[op.args[0]] || []).find(x => x.row === op.tmp); if(e) e.row = r.row; }
      D = prep(D.raw); saveCache();
      softRender();
    }
  } finally {
    flushing = false; setSync();
    if(!outbox.length){ const ks = Object.keys(tmpMap); if(ks.length > 300) ks.slice(0, ks.length - 300).forEach(k => delete tmpMap[k]); saveOutbox(); if(needReload){ needReload = false; load(); } }
  }
}

function letter(n){ let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26);} return s; }
function toObj(r){ const o={row:r.row}; r.v.forEach((x,i)=>{ o[letter(i+1)] = (x===null?'':x); }); return o; }
function prep(d){
  const out = {raw:d, today:d.today, settings:d.settings||{}, sheetUrl:d.sheetUrl, lens:d.lens||[], me:d.me||null, users:d.users||null};
  ['cust','vis','ord','appt','tix','price','frames','ledger','exp'].forEach(k => out[k] = (d[k]||[]).map(toObj));
  out.cust.forEach(c => { c.C = String(c.C||''); });
  out.byPhone = {}; out.cust.forEach(c => { if(c.C) out.byPhone[c.C] = c; });
  out.vis.forEach(v => { v.B = String(v.B||''); });
  out.ord.forEach(o => { o.C = String(o.C||''); });
  out.appt.forEach(a => { a.C = String(a.C||''); });
  return out;
}

const initial = s => (String(s||'؟').replace(/^(د\.|دكتور)\s*/,'').trim()[0] || '؟');
function wa(phone, text){ const p = String(phone||'').slice(1,11); return 'https:\/\/wa.me/964' + p + (text ? '?text=' + encodeURIComponent(text) : ''); }
function d2(s){ if(!s) return null; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function ds(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function addDays(s, n){ const d = d2(s); d.setDate(d.getDate()+n); return ds(d); }
function addMonths(s, n){ const d = d2(s); d.setMonth(d.getMonth()+n); return ds(d); }
function diffDays(a, b){ return Math.round((d2(a) - d2(b)) / 86400000); }
function nice(s){ const d = d2(s); if(!d) return '–'; return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
function rel(s){ if(!s) return ''; const n = diffDays(s, D.today); if(n===0) return 'اليوم'; if(n===1) return 'باجر'; if(n===-1) return 'البارحة'; return n>0 ? 'بعد ' + n + ' يوم' : 'من ' + (-n) + ' يوم'; }
function toast(msg, err, action){
  const t = $('#toast'); t.innerHTML = '<span>' + esc(msg) + '</span>';
  if(action){ const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { t.className = 'toast'; action.fn(); }; t.appendChild(b); }
  t.className = 'toast show' + (err?' err':'') + (action?' act':''); clearTimeout(t._t); t._t = setTimeout(()=> t.className='toast', action ? 7000 : 2600);
}
function showLoading(on){ $('#loading').classList.toggle('show', on); }
function go(view, param){
  const alias = {lenses:'lens', frames:'frames', short:'short'};
  if(alias[view]){ S.invTab = alias[view]; view = 'inv'; }
  if(D && !can(VIEW_PERM[view])){ toast('ما عندك صلاحية لهالقسم', true); view = 'today'; }
  S.view = view; S.param = param || null; S.tab = null; closeMenu(); render(); window.scrollTo(0,0);
  animIn('#view');
  if(view === 'inv' && (S.invTab || 'lens') === 'lens') centerLensRow();
}

const isOpen = o => o.H !== 'تم التسليم' && o.H !== 'ملغي';
function lastVisitOf(phone){ return D.vis.filter(v => v.B===phone).sort((a,b)=> String(b.A).localeCompare(String(a.A)))[0]; }
function callLists(){
  const t = D.today, lim = addDays(t, 14);
  const phones = [...new Set(D.vis.map(v => v.B).filter(Boolean))];
  const due = phones.map(p => ({p, v:lastVisitOf(p)})).filter(x => x.v && x.v.T && x.v.T <= lim)
    .sort((a,b) => String(a.v.T).localeCompare(String(b.v.T)));
  const ready = D.ord.filter(o => o.H === 'جاهز للاستلام');
  const bdays = D.cust.filter(c => d2(c.AC)).map(c => {
    const b = d2(c.AC), today = d2(t); let nb = new Date(today.getFullYear(), b.getMonth(), b.getDate());
    if(nb < today) nb = new Date(today.getFullYear()+1, b.getMonth(), b.getDate());
    return {c, n: Math.round((nb - today)/86400000), date: ds(nb)};
  }).filter(x => x.n <= 7).sort((a,b) => a.n - b.n);
  return {due, ready, bdays, count: due.length + ready.length + bdays.length};
}
function shortages(){
  const st = D.settings, mn = num(st.lensMin), tg = num(st.lensTarget) || 5;
  const lens = [];
  D.lens.forEach((b, bi) => b.qty.forEach((row, r) => row.forEach((q, c) => {
    if(q !== '' && q !== null && num(q) <= mn) lens.push({type:b.name, bi, r, c, sph:LENS_SPH[r], cyl:LENS_CYL[c], q:num(q), need:Math.max(1, tg - num(q))});
  })));
  const fmn = num(st.framesMin), ftg = num(st.framesTarget) || 3;
  const frames = D.frames.filter(f => f.G !== '' && num(f.G) <= fmn).map(f => ({f, q:num(f.G), need:Math.max(1, ftg - num(f.G))}));
  return {lens, frames, count: lens.length + frames.length};
}
function monthKey(s){ return String(s||'').slice(0,7); }

  const cl = callLists().count, sh = shortages().count;

  const todayAppts = D.appt.filter(a => a.A === D.today && a.F !== 'ملغي').length;

  const b = id => badge[id] ? `<span class="badge ${id==='appts'?'gold':''}">${badge[id]}</span>` : '';

function rxCard(v, dark){
  const cell = (val, lab) => `<div><b>${lab==='AXIS'?(val===''?'–':esc(val)):rx(val)}</b><i>${lab}</i></div>`;
  const box = (eye, a, b, c, d) => `<div class="lensbox ${dark?'dk':''}"><div class="eye">${eye}</div><div class="vals">${cell(a,'SPH')}${cell(b,'CYL')}${cell(c,'AXIS')}${cell(d,'ADD')}</div></div>`;
  return `<div class="rx">${box('يمين R', v.E, v.F, v.G, v.H)}${box('يسار L', v.J, v.K, v.L, v.M)}</div>`;
}
function visitCard(v){
  return `<div class="visit"><div class="hd"><b>${nice(v.A)}</b><span class="pill p-ink">${esc(v.D||'فحص')}</span>${v.O?`<span class="pill p-mute">IPD ${esc(v.O)}</span>`:''}${v.I||v.N?`<span class="pill p-mute">VA ${esc(v.I||'–')} / ${esc(v.N||'–')}</span>`:''}<span class="grow"></span><button class="btn sm honey" onclick="orderFromVisit(${v.row})">${ic('glasses')}طلب من هالفحص</button><button class="btn sm ghost" onclick="formVisit(null, ${v.row})">${ic('edit')}تعديل</button></div>
    ${rxCard(v)}
    <div class="s mute" style="margin-top:10px">${[v.P&&'العدسة: '+esc(v.P), v.Q&&'الإطار: '+esc(v.Q), v.R!==''&&v.R!=null&&'المبلغ: '+money(v.R), v.T&&'الموعد الجاي: '+nice(v.T)].filter(Boolean).join('، ')}</div>
    ${v.S?`<div style="margin-top:6px">${esc(v.S)}</div>`:''}</div>`;
}

/* ---------- الوصل صورة ---------- */
let RC = null;
const IMG_LIB = 'https:\/\/cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js';
function loadScript(src){
  return new Promise((res, rej) => { if(window.htmlToImage) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('ما گدرت أحمّل أداة الصورة، تأكد من الإنترنت')); document.head.appendChild(s); });
}
async function receiptImage(){
  await loadScript(IMG_LIB);
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  /* نسخة بعرض ثابت حتى تطلع نفس الشكل بكل جهاز، وخط كبير يتقرا بالواتساب بدون تكبير */
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;top:0;left:-10000px;width:600px;background:#fff;direction:rtl';
  box.innerHTML = $('#modal .receipt').outerHTML;
  box.firstElementChild.classList.add('snap');
  document.body.appendChild(box);
  try {
    const el = box.firstElementChild;
    return await htmlToImage.toBlob(el, {pixelRatio: 2, backgroundColor: '#ffffff', type: 'image/jpeg', quality: 0.93});
  } finally { box.remove(); }
}
async function sendPdf(){
  const btn = $('#pdfBtn'); const label = btn.innerHTML;
  btn.disabled = true; btn.textContent = 'يجهز الصورة…';
  try {
    const blob = await receiptImage();
    const fname = 'وصل ' + RC.num + ' - ' + RC.name + '.jpg';
    const file = new File([blob], fname, {type: 'image/jpeg'});
    if(navigator.canShare && navigator.canShare({files: [file]})){
      try { await navigator.share({files: [file], text: 'وصل رقم ' + RC.num + ' · ' + RC.name + ' · ' + SHOP}); return; }
      catch(e){ if(e && e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast('نزلت صورة الوصل، ارفقها بمحادثة الزبون 📎');
    setTimeout(() => window.open(wa(RC.phone), '_blank'), 900);
  } catch(e){
    toast((e && e.message) || 'ما گدرت أسوي الصورة', true);
  } finally { if(btn.isConnected){ btn.disabled = false; btn.innerHTML = label; } }
}

const ZERO_ROW = LENS_SPH.indexOf(0);
function invStats(){
  const mnL = num(D.settings.lensMin), mnF = num(D.settings.framesMin);
  let lensPcs = 0, lensLow = 0, lensOut = 0;
  D.lens.forEach(b => b.qty.forEach(row => row.forEach(q => { if(q === '' || q == null) return; lensPcs += num(q); if(num(q) === 0) lensOut++; else if(num(q) <= mnL) lensLow++; })));
  const frPcs = D.frames.reduce((s, f) => s + num(f.G), 0);
  const frLow = D.frames.filter(f => f.G !== '' && num(f.G) > 0 && num(f.G) <= mnF).length;
  const frOut = D.frames.filter(f => f.G !== '' && num(f.G) === 0).length;
  return {lensPcs, lensLow, lensOut, frPcs, frLow, frOut, short: shortages().count};
}

      <span class="ii">${ic(icon)}</span><span class="it">${title}</span>

/* =========================================================
   حركات المخزن: تتبع كل مادة من دخولها لحد خروجها
   ========================================================= */
const MT = {open:'رصيد افتتاحي', buy:'شراء', sale:'بيع', ret:'إرجاع', adj:'تعديل يدوي', count:'جرد', none:'بدون صرف'};
const MT_CLS = {'رصيد افتتاحي':'p-mute', 'شراء':'p-ok', 'بيع':'p-ink', 'إرجاع':'p-warn', 'تعديل يدوي':'p-warn', 'جرد':'p-mute', 'بدون صرف':'p-mute', 'تالف':'p-bad'};
const lensKey = (b, r, c) => 'L' + b + ':' + r + ':' + c;
const frameLabel = f => [f.A, f.B, f.C].filter(x => x !== '' && x != null).join(' · ');
function parseKey(k){
  let m = String(k || '').match(/^L(\d+):(\d+):(\d+)$/); if(m) return {kind:'lens', b:+m[1], r:+m[2], c:+m[3]};
  m = String(k || '').match(/^F(-?\d+)$/); if(m) return {kind:'frame', row:+m[1]};
  return null;
}
function itemName(k){
  const p = parseKey(k); if(!p) return '';
  if(p.kind === 'lens') return `${(D.lens[p.b] || {}).name || ''} · SPH ${rx(LENS_SPH[p.r])} · CYL ${LENS_CYL[p.c].toFixed(2)}`;
  const f = D.frames.find(x => x.row === p.row); return f ? frameLabel(f) : (D.ledger.find(x => x.F === k) || {}).G || 'إطار';
}
function itemQty(k){
  const p = parseKey(k); if(!p) return 0;
  if(p.kind === 'lens'){ const q = ((D.lens[p.b] || {}).qty || [])[p.r]; const v = q ? q[p.c] : ''; return v === '' || v == null ? 0 : num(v); }
  const f = D.frames.find(x => x.row === p.row); return f ? num(f.G) : 0;
}
const movesOf = k => D.ledger.filter(x => x.F === k);
const ledgerSum = k => movesOf(k).reduce((s, x) => s + num(x.H), 0);
function sinceCount(k){ const mv = movesOf(k); let i = -1; mv.forEach((x, j) => { if(x.D === 'جرد') i = j; }); return mv.slice(i + 1); }
function ledgerStart(){ const d = D.ledger.map(x => x.B).filter(Boolean).sort()[0]; return d || D.today; }
function nowTime(){ const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }

/* تطبيق محلي فوري لحركة مخزن (قبل ما يرد الشيت) */
let ledSeq = 0;
function localMove(R, moves, opId){
  R.ledger = R.ledger || [];
  moves.forEach(m => {
    if(m.logKey){ R.ledger.push({row: 1e9 + (++ledSeq), _tmp: opId, v: ['', D.today, nowTime(), m.type, parseKey(m.logKey).kind === 'lens' ? 'عدسة' : 'إطار', m.logKey, itemName(m.logKey), num(m.delta), itemQty(m.logKey), m.ref || '', '', '', '', m.note || '', (D.me && D.me.name) || '']}); return; }
    let after = '', delta = num(m.delta), kind = m.kind || 'أخرى', name = m.name || '';
    const p = parseKey(m.key);
    if(p){
      let cur = 0;
      if(p.kind === 'lens'){ const v = R.lens[p.b].qty[p.r][p.c]; cur = v === '' || v == null ? 0 : num(v); kind = 'عدسة'; }
      else { const e = (R.frames || []).find(x => x.row === p.row); cur = e ? num(e.v[6]) : 0; kind = 'إطار'; }
      let target = m.set !== undefined ? (m.set === '' || m.set == null ? '' : Math.max(0, num(m.set))) : Math.max(0, cur + delta);
      const tN = target === '' ? 0 : target;
      if(p.kind === 'lens') R.lens[p.b].qty[p.r][p.c] = target;
      else { const e = (R.frames || []).find(x => x.row === p.row); if(e) e.v[6] = target; }
      delta = tN - cur; after = tN; name = name || itemName(m.key);
      if(delta === 0 && m.type !== 'بدون صرف' && m.type !== 'جرد') return;
    }
    const cost = m.cost === '' || m.cost == null ? '' : num(m.cost);
    R.ledger.push({row: 1e9 + (++ledSeq), _tmp: opId, v: ['', m.date || D.today, nowTime(), m.type, kind, m.key || '', name, delta, after, m.ref || '', cost, cost === '' ? '' : Math.abs(delta) * cost, m.supplier || '', m.note || '', (D.me && D.me.name) || '']});
  });
}
function stockMove(moves, ordRow){
  const opId = 'op' + Date.now() + Math.random().toString(36).slice(2, 6);
  return api('moveStock', moves, opId, ordRow == null ? null : ordRow);
}

/* ---------- الطلب والمخزن ---------- */
function visitForOrder(o){
  const vs = D.vis.filter(v => v.B === o.C && (!o.B || String(v.A) <= String(o.B))).sort((a, b) => String(b.A).localeCompare(String(a.A)));
  return vs[0] || lastVisitOf(o.C);
}
function guessBlock(text){
  const t = String(text || '');
  const find = re => D.lens.findIndex(b => re.test(b.name));
  if(/blue|أزرق/i.test(t)){ const i = find(/blue|أزرق/i); if(i >= 0) return i; }
  if(/photo|تتغمق|فوتو|شمس|trans/i.test(t)){ const i = find(/photo|تتغمق|فوتو|trans/i); if(i >= 0) return i; }
  const i = D.lens.findIndex(b => t && b.name && t.includes(b.name)); return i >= 0 ? i : 0;
}
const idxOf = (arr, v) => arr.findIndex(x => Math.abs(x - v) < 1e-6);
function suggestIssue(o){
  const lines = [];
  const f = o.E ? D.frames.find(x => frameLabel(x) === o.E) : null;
  if(f) lines.push({key:'F' + f.row, label:'الإطار', name:frameLabel(f), qty:1});
  const v = visitForOrder(o);
  if(v){
    const b = guessBlock((o.F || '') + ' ' + (v.P || ''));
    [['يمين','E','F'], ['يسار','J','K']].forEach(([eye, sk, ck]) => {
      if(v[sk] === '' || v[sk] == null) return;
      const sph = num(v[sk]), cyl = num(v[ck] || 0);
      const r = idxOf(LENS_SPH, sph), c = idxOf(LENS_CYL, cyl);
      if(r < 0 || c < 0) lines.push({label:'عدسة ' + eye, name:`SPH ${rx(sph)} · CYL ${rx(cyl)}`, out:true});
      else { const k = lensKey(b, r, c); const ex = lines.find(l => l.key === k); if(ex){ ex.qty++; ex.label = 'العدستين'; } else lines.push({key:k, label:'عدسة ' + eye, name:itemName(k), qty:1, lens:{b, r, c}}); }
    });
  }
  return lines;
}
function orderStock(o){
  if(!o || o.A === '' || o.A == null) return {issued:false, none:false, net:0, rows:[]};
  const ref = 'طلب ' + o.A;
  const rows = D.ledger.filter(x => x.J === ref);
  const net = -rows.filter(x => x.D === 'بيع' || x.D === 'إرجاع').reduce((s, x) => s + num(x.H), 0);
  return {issued: rows.some(x => x.D === 'بيع'), none: rows.some(x => x.D === 'بدون صرف'), net, rows};
}
function needsIssue(o){
  if(!o || o.H === 'ملغي' || o.A === '' || o.A == null) return false;
  if(o.B && String(o.B) < ledgerStart()) return false;
  const st = orderStock(o); if(st.issued || st.none) return false;
  return suggestIssue(o).some(l => l.key);
}
function openIssue(row, fresh){

  openModal('صرف من المخزن · طلب ' + esc(o.A || 'جديد') + ' · ' + esc(name), body,
    `<button class="btn honey" id="issueBtn">${ic('check')}اصرف من المخزن</button><button class="btn ghost" id="noIssueBtn">ما يحتاج صرف</button><span class="grow"></span><button class="btn ghost" onclick="closeModal()">بعدين</button>`);
  $$('.iblk').forEach(sel => sel.onchange = () => {
    const i = +sel.dataset.blk, l = lines[i]; l.lens.b = +sel.value; l.key = lensKey(l.lens.b, l.lens.r, l.lens.c); l.name = itemName(l.key);
    const pill = $(`[data-have="${i}"]`); const q = itemQty(l.key); pill.textContent = 'موجود ' + q; pill.className = 'pill ' + (q >= l.qty ? 'p-ok' : 'p-bad');
  });
  let ref, tmpRow;
  const fixRef = () => {
    let r = row; if(r < 0 && tmpMap[r]) r = tmpMap[r];
    const cur = D.ord.find(x => x.row === r) || o;
    if(r > 0 && cur.A !== '' && cur.A != null){ ref = 'طلب ' + cur.A; tmpRow = null; } else { ref = '#ORDER'; tmpRow = r; }
  };
  $('#issueBtn').onclick = () => { fixRef();
    const pick = $$('.issue input[type=checkbox]').filter(x => x.checked).map(x => lines[+x.dataset.i]);
    if(!pick.length){ toast('ما اخترت شي', true); return; }
    const moves = pick.map(l => ({key:l.key, delta:-l.qty, type:'بيع', ref, note:name}));
    stockMove(moves, tmpRow).then(() => { closeModal(); render(); toast('انصرف من المخزن ✓'); });
  };
  $('#noIssueBtn').onclick = () => { fixRef(); stockMove([{type:'بدون صرف', ref, name:'طلب ' + (o.A || ''), note:'الطلب ما يحتاج صرف من المخزن', delta:0}], tmpRow).then(() => { closeModal(); render(); toast('تمام، انسجل إنه ما يحتاج صرف'); }); };
}
function returnOrder(row){
  const o = D.ord.find(x => x.row === row); if(!o) return;
  const st = orderStock(o), per = {};

  const moves = Object.entries(per).filter(([k, q]) => k && q > 0).map(([k, q]) => ({key:k, delta:q, type:'إرجاع', ref:'طلب ' + o.A, note:'رجعت من طلب ملغي'}));

function orderStockHtml(o){

/* ---------- سجل المادة ---------- */
function itemLog(k){

  const sum = t => mv.filter(x => x.D === t).reduce((s, x) => s + num(x.H), 0);
  const ordRow = ref => { const m = String(ref).match(/^طلب (\d+)/); if(!m) return null; const o = D.ord.find(x => String(x.A) === m[1]); return o ? o.row : null; };
  const stat = (lab, v, cls) => `<div class="lstat ${cls||''}"><b class="num">${v > 0 && cls !== 'cur' ? '+' : ''}${v}</b><span>${lab}</span></div>`;

      ${mv.slice().reverse().map(x => { const orw = ordRow(x.J); return `<tr><td class="num">${esc(x.B)}<div class="mute" style="font-size:12px">${esc(x.C)}</div></td><td><span class="pill ${MT_CLS[x.D]||'p-mute'}">${esc(x.D)}</span></td><td class="num ${num(x.H)<0?'due-late':num(x.H)>0?'qplus':''}"><b>${num(x.H)>0?'+':''}${num(x.H)}</b></td><td class="num">${esc(x.I)}</td><td>${orw ? `<a href="#" onclick="closeModal();orderDetail(${orw});return false">${esc(x.J)}</a>` : esc(x.J)}${x.M ? `<div class="mute" style="font-size:12px">${esc(x.M)}</div>` : ''}</td><td class="mute" style="font-size:13px">${esc(x.N)}${x.K !== '' ? (x.N ? ' · ' : '') + 'كلفة ' + num(x.K).toLocaleString('en-US') : ''}${x.O ? `<div>👤 ${esc(x.O)}</div>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div>` : '<div class="empty sm">ماكو حركات على هالمادة بعد</div>'}`, '');
}

/* ---------- تبويب الحركات والمطابقة ---------- */
function stockAlerts(){
  const unissued = D.ord.filter(needsIssue);
  const cancelled = D.ord.filter(o => o.H === 'ملغي' && orderStock(o).net > 0);
  const keys = new Set(D.ledger.map(x => x.F).filter(Boolean));
  D.lens.forEach((b, bi) => b.qty.forEach((row, r) => row.forEach((q, c) => { if(q !== '' && q != null) keys.add(lensKey(bi, r, c)); })));
  D.frames.forEach(f => { if(f.G !== '' && f.row > 0) keys.add('F' + f.row); });
  const pend = new Set(); if(lensPend) pend.add(lensKey(lensPend.b, lensPend.r, lensPend.c));
  outbox.forEach(o => { if(o.fn === 'moveStock') o.args[0].forEach(m => m.key && pend.add(m.key)); if(o.fn === 'saveRow' && o.args[0] === 'frames') pend.add('F' + o.args[1]); });
  const drift = [...keys].filter(k => !pend.has(k)).filter(k => parseKey(k) && !(parseKey(k).kind === 'frame' && !D.frames.find(f => f.row === parseKey(k).row))).map(k => ({k, sys:itemQty(k), led:ledgerSum(k)})).filter(x => x.sys !== x.led);
  return {unissued, cancelled, drift, count: unissued.length + cancelled.length + drift.length};
}

  </div>
  ${al.count ? `<section class="panel mb attn"><h2>${ic('alert')} تحتاج انتباه <span class="badge">${al.count}</span></h2><div class="list">
    ${al.unissued.map(o => alertRow('glasses', `طلب ${esc(o.A)} · ${esc(custName(o.C) || nameOf(o.D))}`, 'انباع بس ما انصرف من المخزن، فالجرد راح يطلع زايد', `<button class="btn sm honey" onclick="openIssue(${o.row})">صرف</button>`)).join('')}
    ${al.cancelled.map(o => alertRow('refresh', `طلب ${esc(o.A)} ملغي`, `بعده مصروف ${orderStock(o).net} قطعة من المخزن`, `<button class="btn sm" onclick="returnOrder(${o.row})">رجّعها</button>`)).join('')}

function fixDrift(k){

  const kind = parseKey(k).kind === 'lens' ? 'عدسة' : 'إطار';
  /* نسجلها كحركة بدون ما نغيّر الرصيد */
  stockMove([{type:'تعديل يدوي', logKey:k, delta:sys - led, note:'تسوية: تعديل صار مباشرة بالشيت'}]).then(() => { render(); toast('انسجل الفرق ✓'); });
}

/* ---------- فاتورة شراء ---------- */
let PL = [];
function formPurchase(lines){
  PL = (lines && lines.length) ? lines : [{kind:'lens', b:S.lensBlock || 0, r:ZERO_ROW, c:0, qty:1, cost:''}];
  const sups = [...new Set(D.ledger.map(x => x.M).filter(Boolean))];
  openModal('فاتورة شراء', `
    <div class="fgrid">
      <div class="field"><label>رقم الفاتورة <em>*</em></label><input type="text" id="pInv" placeholder="مثلاً 1043"></div>
      <div class="field"><label>التاريخ</label><input type="date" id="pDate" value="${D.today}"></div>
      <div class="field full"><label>المورد</label><input type="text" id="pSup" list="dlSup" placeholder="اسم الوكيل أو الشركة"><datalist id="dlSup">${sups.map(x => `<option value="${esc(x)}">`).join('')}</datalist></div>
    </div>
    <fieldset style="margin-top:16px"><legend>المواد</legend><div id="plines"></div>
      <div class="flex" style="margin-top:10px"><button type="button" class="btn sm ghost" onclick="PL.push({kind:'lens',b:S.lensBlock||0,r:ZERO_ROW,c:0,qty:1,cost:''});drawPL()">${ic('plus')}سطر</button>
      <button type="button" class="btn sm ghost" onclick="plFromShort()">${ic('alert')}عبّيها من النواقص</button></div></fieldset>
    <div class="calc" id="ptot"></div>`,
    `<button class="btn honey" onclick="savePurchase()">حفظ الفاتورة وإدخالها للمخزن</button><span class="grow"></span><button class="btn ghost" onclick="closeModal()">إلغاء</button>`);
  drawPL();
}
function drawPL(){
  const opt = (arr, cur, lab) => arr.map((x, i) => `<option value="${i}" ${i===cur?'selected':''}>${lab ? lab(x) : esc(x)}</option>`).join('');
  $('#plines').innerHTML = PL.map((l, i) => `<div class="pline">
    <select onchange="PL[${i}].kind=this.value;drawPL()"><option value="lens" ${l.kind==='lens'?'selected':''}>عدسة</option><option value="frame" ${l.kind==='frame'?'selected':''}>إطار</option><option value="other" ${l.kind==='other'?'selected':''}>شي ثاني</option></select>
    ${l.kind === 'lens' ? `<select onchange="PL[${i}].b=+this.value">${opt(D.lens.map(b => b.name), l.b)}</select><select class="ltr" onchange="PL[${i}].r=+this.value">${opt(LENS_SPH, l.r, x => 'SPH ' + rx(x))}</select><select class="ltr" onchange="PL[${i}].c=+this.value">${opt(LENS_CYL, l.c, x => 'CYL ' + x.toFixed(2))}</select>`
      : l.kind === 'frame' ? `<select onchange="PL[${i}].row=+this.value">${D.frames.filter(f => f.row > 0).map(f => `<option value="${f.row}" ${f.row===l.row?'selected':''}>${esc(frameLabel(f))}</option>`).join('')}</select>`
      : `<input type="text" placeholder="اسم المادة" value="${esc(l.name||'')}" oninput="PL[${i}].name=this.value">`}
    <input type="number" min="1" value="${l.qty}" title="العدد" placeholder="العدد" oninput="PL[${i}].qty=+this.value;ptot()" class="pq">
    <input type="number" min="0" step="250" value="${l.cost}" placeholder="كلفة القطعة" oninput="PL[${i}].cost=this.value;ptot()" class="pc">
    <button type="button" class="iconbtn" onclick="PL.splice(${i},1);drawPL()" aria-label="شيل">${ic('close')}</button></div>`).join('') || '<div class="mute">ماكو مواد، ضيف سطر</div>';
  if(D.frames.length) PL.forEach(l => { if(l.kind === 'frame' && !l.row) l.row = (D.frames.find(f => f.row > 0) || {}).row; });
  ptot();
}
function ptot(){ const pcs = PL.reduce((s, l) => s + num(l.qty), 0), sum = PL.reduce((s, l) => s + num(l.qty) * num(l.cost), 0); $('#ptot').innerHTML = `<div>عدد القطع<br><b class="num">${pcs}</b></div><div>مجموع الفاتورة<br><b class="num">${sum.toLocaleString('en-US')} د.ع</b></div>`; }
function plFromShort(){
  const {lens, frames} = shortages();
  PL = lens.map(x => ({kind:'lens', b:x.bi, r:x.r, c:x.c, qty:x.need, cost:''})).concat(frames.map(x => ({kind:'frame', row:x.f.row, qty:x.need, cost:''})));
  if(!PL.length) toast('ماكو نواقص هسه');
  drawPL();
}
function savePurchase(){
  const inv = $('#pInv').value.trim(), sup = $('#pSup').value.trim(), date = $('#pDate').value || D.today;
  if(!inv){ toast('اكتب رقم الفاتورة', true); $('#pInv').focus(); return; }
  const lines = PL.filter(l => num(l.qty) > 0 && (l.kind !== 'other' || (l.name || '').trim()));
  if(!lines.length){ toast('ضيف مادة وحدة على الأقل', true); return; }
  const moves = lines.map(l => {
    const key = l.kind === 'lens' ? lensKey(l.b, l.r, l.c) : l.kind === 'frame' ? 'F' + l.row : '';
    return {key, kind: l.kind === 'other' ? 'أخرى' : undefined, name: l.kind === 'other' ? l.name.trim() : undefined, delta: num(l.qty), type:'شراء', ref:'فاتورة ' + inv, cost: l.cost === '' ? '' : num(l.cost), supplier: sup, date};
  });
  stockMove(moves).then(() => { closeModal(); render(); toast('انسجلت الفاتورة ودخلت المواد للمخزن ✓'); });
}

const XLSX_LIB = 'https:\/\/cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
function loadLib(src, globalName){
  return new Promise((res, rej) => { if(window[globalName]) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('ما گدرت أحمّل أداة الإكسل، تأكد من النت')); document.head.appendChild(s); });

async function saveBlob(blob, name){

function ordersUsing(k, pred){ return D.ord.filter(o => pred(o) && suggestIssue(o).some(l => l.key === k)); }
function diagnose(k, sys, act){
  const d = act - sys; if(!d) return [];
  const mv = sinceCount(k), out = [];
  const drift = itemQty(k) - ledgerSum(k);
  if(drift) out.push({cat:'تعديل بالشيت', cls:'p-warn', txt:`الرصيد تغيّر مباشرة بالغوغل شيت بدون حركة (${drift > 0 ? '+' : ''}${drift}). شوف منو عدّل الشيت.`});
  const buys = mv.filter(x => x.D === 'شراء'), buyQ = buys.reduce((s, x) => s + num(x.H), 0), invs = [...new Set(buys.map(x => x.J))].join('، ');
  if(d < 0){
    const un = ordersUsing(k, needsIssue);
    if(un.length) out.push({cat:'بيع ما انصرف', cls:'p-ink', txt:`انباعت بطلب ${un.map(o => o.A).join('، ')} وما انصرفت من المخزن. اصرف الطلب ويروح الفرق.`, fixOrders:un.map(o => o.row)});
    if(buys.length) out.push({cat:'خطأ بالتجهيز؟', cls:'p-warn', txt:`${invs} سجلت ${buyQ} قطعة. إذا الوكيل جهّز أقل من الفاتورة، هنا الفرق. طابق الفاتورة ويه البضاعة.`});
    if(!un.length && !buys.length && !drift) out.push({cat:'نقص بدون سبب', cls:'p-bad', txt:'ماكو حركة تفسر النقص: يمكن انباعت بدون ما ينسجل طلب، أو تلفت، أو ضاعت.'});
  } else {
    const canc = ordersUsing(k, o => o.H === 'ملغي' && orderStock(o).net > 0);
    if(canc.length) out.push({cat:'طلب ملغي', cls:'p-warn', txt:`طلب ${canc.map(o => o.A).join('، ')} انلغى وما رجعت مادته للمخزن.`});
    const sold = mv.filter(x => x.D === 'بيع');
    if(sold.length && !canc.length) out.push({cat:'صرف زايد؟', cls:'p-mute', txt:`انصرفت ${-sold.reduce((s, x) => s + num(x.H), 0)} قطعة بطلبات (${[...new Set(sold.map(x => x.J))].join('، ')}). تأكد ما انصرفت مادة غلط بدالها.`});
    if(!canc.length) out.push({cat:'فاتورة ما انسجلت؟', cls:'p-ok', txt: buys.length ? `يمكن الوكيل جهّز أكثر من ${invs}، أو وصلت بضاعة ثانية بدون فاتورة.` : 'على الأغلب وصلت بضاعة وما انسجلت فاتورة شرائها بالنظام.'});
  }
  return out;
}

function formExpense(pre, row){
  const rec = row ? D.exp.find(x => x.row === row) : Object.assign({A: D.today, E: 1, G: 'نقد'}, pre || {});
  const items = [...new Set(D.exp.map(e => e.B).filter(Boolean))];
  const sections = [{title:'', fields:[
    {k:'B', label:'البند', type:'list', opts:items, req:true, full:true},
    {k:'C', label:'التصنيف', type:'chips', opts:EXP_CATS, full:true},
    {k:'D', label:'سعر المفرد', type:'money', req:true}, {k:'E', label:'الوحدات', type:'num', hint:'مثلاً 3 أمبيرات، 2 موظفين، 1 إيجار'},
    {k:'A', label:'التاريخ', type:'date', quick:[['اليوم','d0'],['البارحة','d-1']]}, {k:'G', label:'طريقة الدفع', type:'chips', opts:OPT.pay.filter(x => x !== 'آجل').concat(['آجل'])},
    {k:'H', label:'ملاحظة', full:true}]}];
  const root = formShell(row ? 'تعديل مصروف' : 'مصروف جديد', sections, rec, v => {
    v.E = v.E === '' ? 1 : num(v.E);
    v.F = num(v.D) * num(v.E);
    if(!v.C) v.C = 'أخرى';
    saveAndClose('exp', row, v, row ? 'انحفظ' : 'انسجل المصروف');
  }, row ? () => delRow('exp', row) : null, `<div class="calc" id="ecalc"></div>`);
  const calc = () => { const d = num($('#f_D', root).value), e = $('#f_E', root).value === '' ? 1 : num($('#f_E', root).value); $('#ecalc').innerHTML = `<div>${iqd(d)} × ${e}</div><div>الإجمالي<br><b class="num">${iqd(d * e)} د.ع</b></div>`; };
  $('#f_D', root).addEventListener('input', calc); $('#f_E', root).addEventListener('input', calc); calc();
  /* نفس البند المسجل قبل: يعبي السعر والتصنيف */
  $('#f_B', root).addEventListener('change', () => { if(row) return; const last = D.exp.slice().reverse().find(e => e.B === $('#f_B', root).value); if(last){ if(!$('#f_D', root).value) $('#f_D', root).value = last.D; if(!$('#f_C', root).value){ const ch = $(`[data-k="C"] .chip[data-v="${CSS.escape(last.C || 'أخرى')}"]`, root); if(ch) ch.click(); } calc(); } });
}

VIEWS.summary = () => {
  const t = d2(D.today);
  const startMin = new Date(2026, 9, 1);
  let start = new Date(t.getFullYear(), t.getMonth() - 11, 1); if(start < startMin) start = startMin;
  const months = []; for(let i=0;i<12;i++){ const d = new Date(start.getFullYear(), start.getMonth()+i, 1); months.push(ds(d).slice(0,7)); }
  const rows = months.map(m => {
    const os = D.ord.filter(o => monthKey(o.B) === m && o.H !== 'ملغي');
    const sales = os.reduce((s,o) => s + num(o.L), 0);
    const buy = D.ledger.filter(x => x.D === 'شراء' && monthKey(x.B) === m).reduce((s,x) => s + num(x.L), 0);
    const ex = D.exp.filter(e => monthKey(e.A) === m).reduce((s,e) => s + num(e.F), 0);
    return {m, n:os.length, sales, buy, ex, net: sales - buy - ex, disc:os.reduce((s,o) => s + num(o.J), 0), avg: os.length ? Math.round(sales/os.length) : 0,
      newc: D.cust.filter(c => monthKey(c.H) === m).length, vis: D.vis.filter(v => monthKey(v.A) === m).length};
  });
  const max = Math.max(1, ...rows.map(r => r.sales));
  const cur = ds(t).slice(0,7);
  const mlabel = m => MONTHS[+m.slice(5,7)-1] + ' ' + m.slice(0,4);
  const tally = arr => { const o = {}; arr.forEach(x => { if(x) o[x] = (o[x]||0) + 1; }); return Object.entries(o).sort((a,b) => b[1]-a[1]).slice(0,8); };
  const src = tally(D.cust.map(c => c.I)), lens = tally(D.ord.filter(o => o.H!=='ملغي').map(o => o.F));
  const tot = rows.reduce((a,r) => ({n:a.n+r.n, sales:a.sales+r.sales, buy:a.buy+r.buy, ex:a.ex+r.ex, net:a.net+r.net, disc:a.disc+r.disc, newc:a.newc+r.newc, vis:a.vis+r.vis}), {n:0,sales:0,buy:0,ex:0,net:0,disc:0,newc:0,vis:0});
  const okOrd = D.ord.filter(o => o.H !== 'ملغي');
  const cnt = (names, field) => { const c = {}; names.forEach(n => c[n] = 0); okOrd.forEach(o => { const v = o[field]; if(v) c[v] = (c[v] || 0) + 1; }); return Object.entries(c); };
  const lensNames = D.price.filter(p => p.A === 'عدسة' || p.A === 'عدسات لاصقة').map(p => p.B);
  const lensAll = cnt(lensNames, 'F'), frAll = cnt(D.frames.filter(f => f.row > 0).map(frameLabel), 'E');
  const lensLeast = lensAll.slice().sort((a,b) => a[1]-b[1]).slice(0,8);
  const frMost = frAll.filter(x => x[1] > 0).sort((a,b) => b[1]-a[1]).slice(0,8), frLeast = frAll.slice().sort((a,b) => a[1]-b[1]).slice(0,8);
  const hbLow = (list, emptyTxt) => list.length ? list.map(x => `<div class="flex" style="padding:7px 0;border-bottom:1px solid var(--line2)"><span class="grow">${esc(x[0])}</span>${x[1] ? `<b class="num">${x[1]} طلب</b>` : '<span class="pill p-bad">ما انطلبت</span>'}</div>`).join('') : `<div class="empty sm">${emptyTxt}</div>`;
  const hb = (list) => { const mx = Math.max(1, ...list.map(x => x[1])); return list.length ? list.map(x => `<div style="margin-bottom:10px"><div class="flex"><span class="grow">${esc(x[0])}</span><b class="num">${Number(x[1]).toLocaleString('en-US')}</b></div><div class="hbar" style="width:${Math.round(x[1]/mx*100)}%"></div></div>`).join('') : '<div class="empty">ماكو بيانات بعد</div>'; };
  return `${head('الملخص الشهري', 'من ' + mlabel(months[0]) + ' لـ ' + mlabel(months[11]))}
  <section class="panel mb"><h2>المبيعات كل شهر (دينار)</h2>
    <div class="bars">${rows.map(r => `<div class="bar ${r.m===cur?'cur':''}"><em class="num">${r.sales?Math.round(r.sales/1000)+'k':''}</em><i style="height:${Math.round(r.sales/max*85)}%"></i><span>${MONTHS[+r.m.slice(5,7)-1]}</span></div>`).join('')}</div></section>
  <section class="panel mb" style="overflow:auto"><table class="t"><thead><tr><th>الشهر</th><th>الطلبات</th><th>المبيعات</th><th>المشتريات</th><th>المصاريف</th><th>الصافي</th><th>الخصومات</th><th>متوسط الطلب</th><th>زبائن جدد</th><th>فحوصات</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="${r.m===cur?'cur':''}"><td>${mlabel(r.m)}</td><td class="num">${r.n||'-'}</td><td class="num">${r.sales?r.sales.toLocaleString('en-US'):'-'}</td><td class="num">${r.buy?r.buy.toLocaleString('en-US'):'-'}</td><td class="num">${r.ex?r.ex.toLocaleString('en-US'):'-'}</td><td class="num"><b class="${r.net<0?'due-late':''}">${r.sales||r.buy||r.ex?r.net.toLocaleString('en-US'):'-'}</b></td><td class="num">${r.disc?r.disc.toLocaleString('en-US'):'-'}</td><td class="num">${r.avg?r.avg.toLocaleString('en-US'):'-'}</td><td class="num">${r.newc||'-'}</td><td class="num">${r.vis||'-'}</td></tr>`).join('')}
    <tr class="tot"><td>المجموع</td><td class="num">${tot.n}</td><td class="num">${tot.sales.toLocaleString('en-US')}</td><td class="num">${tot.buy.toLocaleString('en-US')}</td><td class="num">${tot.ex.toLocaleString('en-US')}</td><td class="num">${tot.net.toLocaleString('en-US')}</td><td class="num">${tot.disc.toLocaleString('en-US')}</td><td class="num">${tot.n?Math.round(tot.sales/tot.n).toLocaleString('en-US'):'-'}</td><td class="num">${tot.newc}</td><td class="num">${tot.vis}</td></tr>
  </tbody></table></section>
  <div class="grid g2 mb"><section class="panel"><h2>أكثر العدسات طلباً</h2>${hb(lens)}</section><section class="panel"><h2>أقل العدسات طلباً</h2>${hbLow(lensLeast, 'سجّل العدسات بقائمة الأسعار حتى تطلع هنا')}</section></div>
  <div class="grid g2 mb"><section class="panel"><h2>أكثر الإطارات طلباً</h2>${hb(frMost)}</section><section class="panel"><h2>أقل الإطارات طلباً</h2>${hbLow(frLeast, 'سجّل الإطارات بالجرد حتى تطلع هنا')}</section></div>
  <div class="grid g2"><section class="panel"><h2>منين يجونا الزبائن</h2>${hb(src)}</section><section class="panel"><h2>المبيعات والمشتريات والمصاريف</h2>${hb([['المبيعات · د.ع', tot.sales], ['المشتريات · د.ع', tot.buy], ['المصاريف · د.ع', tot.ex]].filter(x => x[1]))}</section></div>`;
};

/* مولّد الحقول: k = عمود الشيت */
function field(f, val){
  const v = (val===undefined || val===null) ? (f.def!==undefined ? f.def : '') : val;
  const lab = `<label for="f_${f.k}">${f.label}${f.req?' <em>*</em>':''}</label>`;
  const wrap = (inner) => `<div class="field ${f.full?'full':''}" data-k="${f.k}" data-type="${f.type}">${lab}${inner}${f.hint?`<div class="hint">${f.hint}</div>`:''}</div>`;
  switch(f.type){
    case 'chips': return wrap(`<div class="chips" data-chips>${f.opts.map(o => `<button type="button" class="chip ${String(v)===String(o)?'on':''}" data-v="${esc(o)}">${esc(o)}${f.suffix||''}</button>`).join('')}</div><input type="hidden" id="f_${f.k}" value="${esc(v)}">`);
    case 'multi': { const sel = String(v||'').split(/\s*[،,]\s*/).filter(Boolean);
      const extra = sel.filter(x => !f.opts.includes(x));
      return wrap(`<div class="chips" data-multi>${f.opts.concat(extra).map(o => `<button type="button" class="chip ${sel.includes(o)?'on':''}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div><input type="hidden" id="f_${f.k}" value="${esc(sel.join('، '))}">`); }
    case 'select': return wrap(`<select id="f_${f.k}"><option value="">—</option>${f.opts.map(o => `<option ${String(v)===String(o)?'selected':''}>${esc(o)}</option>`).join('')}${v && !f.opts.map(String).includes(String(v)) ? `<option selected>${esc(v)}</option>` : ''}</select>`);
    case 'date': return wrap(`<input type="date" id="f_${f.k}" value="${esc(v)}">${f.quick?`<div class="quick">${f.quick.map(q => `<button type="button" class="chip mini" onclick="quickDate('${f.k}','${q[1]}')">${q[0]}</button>`).join('')}</div>`:''}`);
    case 'area': return wrap(`<textarea id="f_${f.k}">${esc(v)}</textarea>`);
    case 'money': return wrap(`<input type="number" inputmode="numeric" min="0" step="250" id="f_${f.k}" value="${esc(v)}" oninput="liveCalc&&liveCalc()">`);
    case 'num': return wrap(`<input type="number" inputmode="numeric" id="f_${f.k}" value="${esc(v)}">`);
    case 'tel': return wrap(`<input type="tel" inputmode="tel" dir="ltr" id="f_${f.k}" value="${esc(v)}" placeholder="07XXXXXXXXX">`);
    case 'cust': case 'custFree': return wrap(`<div class="picker"><input type="text" id="f_${f.k}" value="${esc(v)}" autocomplete="off" placeholder="${f.type==='custFree'?'اختار زبون، أو اكتب اسم ورقم الجديد':'اكتب أول حروف الاسم أو الرقم'}" data-picker="${f.type}"><div class="sugg"></div></div>`);
    case 'list': return wrap(`<input type="text" id="f_${f.k}" value="${esc(v)}" list="dl_${f.k}" autocomplete="off"><datalist id="dl_${f.k}">${(f.opts||[]).map(o => `<option value="${esc(o)}">`).join('')}</datalist>`);
    case 'slot': return wrap(`<div class="slots" id="slots_${f.k}"></div><input type="hidden" id="f_${f.k}" value="${esc(v)}">`);
    default: return wrap(`<input type="text" id="f_${f.k}" value="${esc(v)}">`);
  }
}
function quickDate(k, spec){
  const i = $('#f_' + k); const base = D.today;
  const m = spec.match(/^([dm])(-?\d+)$/);
  i.value = m[1]==='d' ? addDays(base, +m[2]) : addMonths(base, +m[2]);
  i.dispatchEvent(new Event('change'));
}
function bindForm(root){
  $$('[data-chips]', root).forEach(box => box.onclick = e => {
    const b = e.target.closest('.chip'); if(!b) return;
    const inp = box.nextElementSibling; const on = b.classList.contains('on');
    $$('.chip', box).forEach(x => x.classList.remove('on'));
    if(!on){ b.classList.add('on'); inp.value = b.dataset.v; } else inp.value = '';
    inp.dispatchEvent(new Event('change'));
  });
  $$('[data-multi]', root).forEach(box => box.onclick = e => {
    const b = e.target.closest('.chip'); if(!b) return;
    b.classList.toggle('on');
    const inp = box.nextElementSibling;
    inp.value = $$('.chip.on', box).map(x => x.dataset.v).join('، ');
    inp.dispatchEvent(new Event('change'));
  });
  $$('[data-picker]', root).forEach(inp => {
    const box = inp.nextElementSibling;
    const show = () => {
      const q = inp.value.trim();
      const list = D.cust.filter(c => !q || String(c.B).includes(q) || String(c.C).includes(q) || custLabel(c) === q).slice(0, 8);
      box.innerHTML = list.length ? list.map(c => `<div data-v="${esc(custLabel(c))}"><b>${esc(c.B)}</b><small class="ltr">${esc(c.C)}</small></div>`).join('') : `<div style="cursor:default" class="mute">${inp.dataset.picker==='custFree'?'زبون جديد؟ اكتب اسمه ورقمه':'ماكو زبون بهذا الاسم. سجّله أول من «زبون جديد»'}</div>`;
      box.classList.add('open');
    };
    inp.addEventListener('focus', show); inp.addEventListener('input', show);
    inp.addEventListener('blur', () => setTimeout(() => box.classList.remove('open'), 180));
    box.addEventListener('mousedown', e => { const d = e.target.closest('[data-v]'); if(d){ inp.value = d.dataset.v; box.classList.remove('open'); inp.dispatchEvent(new Event('change')); } });
  });
}
function readForm(root, fields){
  const out = {};
  for(const f of fields){
    const e = $('#f_' + f.k, root); if(!e) continue;
    let v = e.value.trim();
    if(f.req && !v){ toast('عبّي خانة «' + f.label + '»', true); e.focus && e.focus(); return null; }
    if(f.type === 'cust' && v && !phoneOf(v)){ toast('اختار الزبون من القائمة', true); return null; }
    if(f.type === 'custFree' && v && !phoneOf(v)){ toast('اكتب رقم الموبايل ويا الاسم، أو اختار من القائمة', true); return null; }
    if(f.type === 'tel' && v && !/^0\d{10}(\/\d+)?$/.test(v)){ toast('رقم الموبايل لازم 11 رقم ويبدي بـ 0', true); return null; }
    if(['money','num'].includes(f.type) && v !== '') v = Number(v);
    out[f.k] = v;
  }
  return out;
}
function formShell(title, sections, rec, saveFn, delFn, extraBody){
  liveCalc = null;
  if(!can('del')) delFn = null;
  const all = sections.flatMap(s => s.fields);
  const body = sections.map(s => `<fieldset>${s.title?`<legend>${s.title}</legend>`:''}${s.html || ''}<div class="fgrid">${s.fields.map(f => field(f, rec ? rec[f.k] : undefined)).join('')}</div></fieldset>`).join('') + (extraBody || '');
  openModal(title, body, `<button class="btn honey" id="saveBtn">حفظ</button><button class="btn ghost" onclick="closeModal()">إلغاء</button><span class="grow"></span>${delFn?'<button class="btn bad" id="delBtn">حذف</button>':''}`);
  const root = $('#modal');
  bindForm(root);
  $('#saveBtn').onclick = () => { const v = readForm(root, all); if(v) saveFn(v, root); };
  if(delFn) $('#delBtn').onclick = () => { if(confirm('متأكد تريد تحذفه؟ ما يرجع.')) delFn(); };
  return root;
}
function saveAndClose(key, row, fields, msg, after){
  api('saveRow', key, row || null, fields).then(d => { closeModal(); apply(d, msg || 'انحفظ'); if(after) after(); });
}

const darkMQ = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function isDark(){ return PREFS.theme === 'dark' || (PREFS.theme === 'auto' && darkMQ && darkMQ.matches); }

/* الأرقام العربية: نحوّل نص الشاشة بس، والبيانات بالشيت تبقى مثل ما هي */
const AR_DIG = '٠١٢٣٤٥٦٧٨٩';
function arabizeNode(root){
  if(PREFS.digits !== 'ar' || !root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n => {
    const p = n.parentElement; if(!p || !/\d/.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
    if(p.closest('script,style,textarea,input,select,option,.keep-en')) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT; }});
  const list = []; while(w.nextNode()) list.push(w.currentNode);
  list.forEach(n => { n.nodeValue = n.nodeValue.replace(/\d/g, d => AR_DIG[d]); });
}
function arabizeAll(){ arabizeNode(document.body); }
new MutationObserver(ms => { if(PREFS.digits !== 'ar') return; ms.forEach(m => m.addedNodes.forEach(n => { if(n.nodeType === 1) arabizeNode(n); else if(n.nodeType === 3 && n.parentElement) arabizeNode(n.parentElement); })); })
  .observe(document.body, {childList:true, subtree:true});

function openSearch(){
  closeMenu();
  openModal('بحث سريع', `<div class="search">${ic('search')}<input id="gq" type="search" placeholder="اسم، رقم موبايل، أو رقم طلب" autocomplete="off"></div><div class="gres" id="gres"></div>`, '');
  $('#modal').classList.add('spotm'); $('#modal .sheet').classList.add('spot');
  const i = $('#gq'); i.focus();
  let hl = 0;
  const draw = () => { $('#gres').innerHTML = searchHtml(i.value.trim()); hl = 0; mark(); };
  const mark = () => { const rows = $$('#gres .row'); rows.forEach((r, k) => r.classList.toggle('hl', k === hl)); if(rows[hl]) rows[hl].scrollIntoView({block:'nearest'}); };
  i.oninput = draw;
  i.onkeydown = e => {
    const rows = $$('#gres .row');
    if(e.key === 'ArrowDown'){ hl = Math.min(rows.length - 1, hl + 1); mark(); e.preventDefault(); }
    if(e.key === 'ArrowUp'){ hl = Math.max(0, hl - 1); mark(); e.preventDefault(); }
    if(e.key === 'Enter' && rows[hl]){ rows[hl].click(); e.preventDefault(); }
  };
  draw();
}
function hlText(s, q){ s = esc(s); if(!q) return s; const i = s.indexOf(esc(q)); return i < 0 ? s : s.slice(0, i) + '<mark>' + s.slice(i, i + esc(q).length) + '</mark>' + s.slice(i + esc(q).length); }
function searchHtml(q){
  if(!q){
    const recent = D.cust.slice(-6).reverse();
    return recent.length ? `<h4>آخر الزبائن</h4>${recent.map(c => custHit(c, '')).join('')}` : `<div class="empty sm">اكتب اسم الزبون أو رقمه</div>`;
  }
  const qd = q.replace(/[٠-٩]/g, d => AR_DIG.indexOf(d));
  const cust = D.cust.filter(c => String(c.B).includes(q) || String(c.C).includes(qd)).slice(0, 8);
  const ords = D.ord.filter(o => String(o.A) === qd || (custName(o.C) || nameOf(o.D)).includes(q) || String(o.C).includes(qd)).slice(0, 6);
  const appts = D.appt.filter(a => a.A >= D.today && a.F !== 'ملغي' && ((custName(a.C) || nameOf(a.D)).includes(q) || String(a.C).includes(qd))).slice(0, 4);
  let h = '';
  if(cust.length) h += `<h4>الزبائن</h4>` + cust.map(c => custHit(c, q, qd)).join('');
  if(ords.length) h += `<h4>الطلبات</h4>` + ords.map(o => { const n = custName(o.C) || nameOf(o.D); return `<div class="row" onclick="closeModal();orderDetail(${o.row})"><div class="avatar">${ic('glasses')}</div><div class="main"><div class="t">طلب ${esc(o.A)} · ${hlText(n, q)}</div><div class="s">${esc(o.H || '')}${o.L !== '' ? '، ' + money(o.L) : ''}${num(o.N) > 0 ? '، باقي ' + money(o.N) : ''}</div></div></div>`; }).join('');
  if(appts.length) h += `<h4>المواعيد الجاية</h4>` + appts.map(a => { const n = custName(a.C) || nameOf(a.D); return `<div class="row" onclick="closeModal();S.apptDay='${a.A}';go('appts')"><div class="avatar">${ic('cal')}</div><div class="main"><div class="t">${hlText(n, q)}</div><div class="s">${nice(a.A)} · ${esc(a.B)}</div></div></div>`; }).join('');
  return h || `<div class="empty sm"><b>ماكو نتائج</b><button class="btn sm honey" onclick="closeModal();formCustomer(${/^0\d/.test(qd) ? `{C:'${esc(qd)}'}` : `{B:'${esc(q)}'}`})">سجّله زبون جديد</button></div>`;
}
function custHit(c, q, qd){
  const v = lastVisitOf(c.C), open = D.ord.filter(o => o.C === c.C && isOpen(o)).length;
  return `<div class="row" onclick="closeModal();go('customer',${c.row})"><div class="avatar">${esc(initial(c.B))}</div><div class="main"><div class="t">${hlText(c.B, q)}</div><div class="s"><span class="ltr">${hlText(c.C, qd || q)}</span>${v ? '، آخر فحص ' + rel(v.A) : ''}${open ? '، ' + open + ' طلب مفتوح' : ''}</div></div></div>`;
}
document.addEventListener('keydown', e => {
  const tag = (document.activeElement || {}).tagName || '';
  if(((e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(tag)) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) && D){ e.preventDefault(); openSearch(); }

   أعياد الميلاد
   ========================================================= */
function bdayMsg(c){ return `كل عام وانت بخير ${c.B} 🎂\nمن كل قلبنا بـ${SHOP} نتمنالك سنة حلوة وواضحة.` + (PREFS.bdayOffer ? '\n' + PREFS.bdayOffer : ''); }
function bdaySentKey(c){ return 'bd_' + String(D.today).slice(0,4) + '_' + c.C; }
function bdaySent(c){ return !!LS.get(bdaySentKey(c), false); }
function markBday(c){ LS.set(bdaySentKey(c), true); setTimeout(render, 300); }
function bdayBtn(c){ return `<a class="btn sm wa" href="${wa(c.C, bdayMsg(c))}" target="_blank" onclick="markBday(D.byPhone['${esc(c.C)}'])">${ic('wa')}${bdaySent(c) ? 'انبعثت ✓' : 'دز التهنئة'}</a>`; }

/* =========================================================
   الطلب: الخطوة الجاية بضغطة
   ========================================================= */
const NEXT = {'بالمختبر':['جاهز للاستلام','صارت جاهزة'], 'جاهز للاستلام':['تم التسليم','انسلمت']};
function nextStep(row, ev){
  if(ev) ev.stopPropagation();
  const o = D.ord.find(x => x.row === row); if(!o) return;
  const n = NEXT[o.H || 'بالمختبر']; if(!n) return;
  const f = {H: n[0]}; if(n[0] === 'تم التسليم' && !o.U) f.U = D.today;
  api('saveRow', 'ord', row, f).then(() => {
    render();
    if(n[0] === 'جاهز للاستلام') toast('صارت جاهزة', false, {label:'بلّغه واتساب', fn: () => { const o2 = D.ord.find(x => x.row === row) || o; window.open(wa(o2.C, readyMsg(o2)), '_blank'); api('saveRow','ord', row, {T:'نعم'}).then(render); }});
    else toast('انسلمت ✓');
  });
}
function readyMsg(o){ const name = custName(o.C) || nameOf(o.D); return `هلا ${name}، نظارتك جاهزة بـ${SHOP}. تكدر تستلمها بأي وقت يناسبك${num(o.N)>0?'، والباقي '+num(o.N).toLocaleString('en-US')+' دينار':''}. نورتنا`; }

/* طلب من فحص */
function orderFromVisit(vrow){
  const v = D.vis.find(x => x.row === vrow); if(!v) return;
  const c = D.byPhone[v.B];
  const pre = {D: c ? custLabel(c) : v.C, Y: 'من فحص ' + nice(v.A)};
  if(v.Q) pre.E = v.Q;
  if(v.P){ const p = D.price.find(x => x.B === v.P) || D.price.find(x => String(x.B).includes(v.P) || String(x.D || '').includes(v.P)); pre.F = p ? p.B : v.P; if(p && p.E !== '') pre.I = p.E; }
  if(v.R !== '' && v.R != null && pre.I == null) pre.I = v.R;
  closeModal(); formOrder(pre);
}

/* =========================================================
   تشغيل
   ========================================================= */
applyPrefs();
boot();
</script>
